name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Django django-multitenant psycopg2-binary pytest pytest-django playwright

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run backend tests
        working-directory: backend/conf
        env:
          DJANGO_SETTINGS_MODULE: conf.settings
          PYTHONPATH: ../../backend:../../backend/workspaces/tests
DB_ENGINE: django.db.backends.postgresql
           SECRET_KEY: ${{ secrets.SECRET_KEY }}
           SECRET_TEST_PASS: ${{ secrets.SECRET_TEST_PASS }}
           WEBHOOK_SIGNING_SECRET: ${{ secrets.WEBHOOK_SIGNING_SECRET }}
           DEBUG: "True"
        run: python3 -m pytest workspaces/tests/ -v --tb=short

      - name: Start Django dev server for E2E
        working-directory: backend/conf
        env:
          DJANGO_SETTINGS_MODULE: conf.settings
          PYTHONPATH: ../../backend:../../backend/workspaces/tests
DB_ENGINE: django.db.backends.postgresql
           SECRET_KEY: ${{ secrets.SECRET_KEY }}
           DEBUG: "True"
        run: |
          python3 manage.py runserver 127.0.0.1:8000 > /tmp/django-server.log 2>&1 &
          DJANGO_PID=$!
          # Readiness check: wait up to 30s for the server to respond
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/ > /dev/null 2>&1; then
              echo "Django dev server is ready on http://127.0.0.1:8000"
              exit 0
            fi
            sleep 1
          done
          echo "Django dev server failed to become ready" >&2
          cat /tmp/django-server.log >&2 || true
          kill "$DJANGO_PID" 2>/dev/null || true
          exit 1

      - name: Run Playwright E2E tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test

# NOTE (CR-009): Concurrency tests (e.g. test_two_recovery_workers_one_delivery)
# require PostgreSQL to run. CI now uses DB_ENGINE=django.db.backends.postgresql,
# so these tests are executed against the PostgreSQL test database.
