name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: f04
          POSTGRES_USER: f04
          POSTGRES_PASSWORD: f04
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U f04 -d f04"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r backend/requirements.txt
          pip install pytest pytest-django

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run backend tests
        working-directory: backend/conf
        env:
          DJANGO_SETTINGS_MODULE: conf.settings
          PYTHONPATH: ../../backend:../../backend/workspaces/tests
          DB_ENGINE: django.db.backends.postgresql
          POSTGRES_DB: f04
          POSTGRES_USER: f04
          POSTGRES_PASSWORD: f04
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SECRET_TEST_PASS: ${{ secrets.SECRET_TEST_PASS }}
          WEBHOOK_SIGNING_SECRET: ${{ secrets.WEBHOOK_SIGNING_SECRET }}
          DEBUG: "True"
        run: python3 -m pytest workspaces/tests/ -v --tb=short

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start Django dev server for E2E
        working-directory: backend/conf
        env:
          DJANGO_SETTINGS_MODULE: conf.settings
          PYTHONPATH: ../../backend:../../backend/workspaces/tests
          DB_ENGINE: django.db.backends.postgresql
          POSTGRES_DB: f04
          POSTGRES_USER: f04
          POSTGRES_PASSWORD: f04
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "True"
        run: |
          python3 manage.py runserver 127.0.0.1:8000 > /tmp/django-server.log 2>&1 &
          DJANGO_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/ > /dev/null 2>&1; then
              echo "Django dev server is ready on http://127.0.0.1:8000"
              exit 0
            fi
            sleep 1
          done
          echo "Django dev server failed to become ready" >&2
          cat /tmp/django-server.log >&2 || true
          kill "$DJANGO_PID" 2>/dev/null || true
          exit 1

      - name: Run Playwright E2E tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test
