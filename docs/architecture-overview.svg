  <title id="title">F01 and F04 architecture overview</title>
  <desc id="desc">F01 React connects to Express, which uses MongoDB, Redis, and Stripe Connect. F04 React connects to Django REST, which uses PostgreSQL, Celery with Redis, and Stripe Billing.</desc>
