    <rect x="245" y="57" width="180" height="52" rx="8"/>
    <rect x="477" y="49" width="255" height="68" rx="8"/>
    <rect x="28" y="196" width="165" height="52" rx="8"/>
    <rect x="245" y="196" width="180" height="52" rx="8"/>
    <rect x="477" y="176" width="255" height="92" rx="8"/>
  </g>
  <g fill="none" stroke="#526480" stroke-width="2" marker-end="url(#arrow)">
