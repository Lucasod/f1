/**
 * OpenAPI schema updates for T-1007: Backend Wallet/Transaction Contract.
 *
 * Defines the API contract for wallet and transaction operations.
 * Follows the project's OpenAPI specification version and conventions.
 */

openapi: 3.1.0
info:
  title: Kilo Orchestration Wallet/Transaction API
  version: 1.0.0
  description: API for wallet and transaction management in the Kilo Marketplace
  contact:
    name: Kilo Marketplace
servers:
  - url: /api
    description: Development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ## TransactionType enum
    TransactionType:
      type: string
      enum: [SALE, COMMISSION, REFUND, PAYOUT, ADJUSTMENT]
      description: Type of financial transaction

    ## ReferenceType enum
    ReferenceType:
      type: string
      enum: [OrderVendorGroup, Order, Refund, Payout]
      description: Type of reference entity for the transaction

    ## Wallet schema
    Wallet:
      type: object
      required:
        - ownerType
        - ownerId
        - currency
        - balance
      properties:
        ownerType:
          type: string
          enum: [vendor, marketplace]
          description: Identity type of the wallet owner
        ownerId:
          type: string
          description: Identity of the wallet owner (vendor_id or 'marketplace')
        currency:
          type: string
          const: BRL
          description: Currency used for balance (BRL for MVP)
        balance:
          type: number
          description: Current wallet balance (derived from transactions)
        last_transaction_id:
          type: string
          description: ID of the most recent transaction affecting this wallet

    ## Transaction schema
    Transaction:
      type: object
      required:
        - walletId
        - type
        - amount
        - runningBalance
        - referenceId
        - referenceType
        - createdAt
      properties:
        walletId:
          type: string
          description: ID of the wallet associated with this transaction
        type:
          $ref: '#/components/schemas/TransactionType'
          description: Type of financial movement
        amount:
          type: number
          description: Transaction amount (positive = credit, negative = debit)
        runningBalance:
          type: number
          description: Wallet balance after this transaction (snapshot)
        referenceId:
          type: string
          description: Reference ID (order ID, refund ID, etc.)
        referenceType:
          $ref: '#/components/schemas/ReferenceType'
          description: Type of reference entity
        paymentId:
          type: string
          description: Optional payment provider ID (e.g., Stripe charge ID)
        refundId:
          type: string
          description: Optional refund ID linking to refund transaction
        metadata:
          type: object
          description: Optional metadata object (ovg_id, commission_pct, order_id, etc.)
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the transaction was created

    ## Error response schema
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: integer
          description: HTTP status code or error code

paths:
  /api/wallets/{id}:
    get:
      summary: Get wallet by ID
      operationId: getWallet
      tags:
        - wallet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Wallet ID
      responses:
        '200':
          description: Wallet retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '404':
          description: Wallet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/wallets/{id}/state:
    get:
      summary: Get wallet balance and latest transaction
      operationId: getWalletState
      tags:
        - wallet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Wallet ID
      responses:
        '200':
          description: Wallet state retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: number
                    description: Current wallet balance
                  lastTransaction:
                    allOf:
                      - $ref: '#/components/schemas/Transaction'
                      - description: Latest transaction for this wallet
        '404':
          description: Wallet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/transactions:
    post:
      summary: Record a new transaction (atomic: creates Transaction + updates Wallet balance)
      operationId: recordTransaction
      tags:
        - transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - walletId
                - type
                - amount
                - referenceId
                - referenceType
              properties:
                walletId:
                  type: string
                  description: ID of the wallet associated with this transaction
                type:
                  $ref: '#/components/schemas/TransactionType'
                  description: Type of financial movement
                amount:
                  type: number
                  description: Transaction amount (positive = credit, negative = debit)
                referenceId:
                  type: string
                  description: Reference ID (order ID, refund ID, etc.)
                referenceType:
                  $ref: '#/components/schemas/ReferenceType'
                  description: Type of reference entity
                paymentId:
                  type: string
                  description: Optional payment provider ID
                refundId:
                  type: string
                  description: Optional refund ID
                metadata:
                  type: object
                  description: Optional metadata object
                  properties:
                    ovg_id:
                      type: string
                      description: Order_Vendor_Group ID
                    order_id:
                      type: string
                      description: Order ID
                    commission_pct:
                      type: number
                      description: Commission percentage
        responses:
          '201':
            description: Transaction recorded successfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Transaction'
          '400':
            description: Invalid input (bad type, reference type, or missing fields)
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
          '500':
            description: Internal server error
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'

  /api/wallets:
    get:
      summary: List wallets (admin sees all, vendor sees own)
      operationId: listWallets
      tags:
        - wallet
      responses:
        '200':
          description: Wallets retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  marketplace:
                    $ref: '#/components/schemas/Wallet'
                    description: Marketplace singleton wallet
                  vendor:
                    $ref: '#/components/schemas/Wallet'
                    description: Vendor wallet (may be null)
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'