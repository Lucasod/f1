      description: Uploads one validated JPEG, PNG, or WebP image to temporary local storage. The authenticated Consumer must own the review. The storage adapter can be replaced by S3 when that provider integration is required.
      operationId: uploadReviewImage
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
          description: Review unique identifier
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG, PNG, or WebP image; max 10 MB and at least 800x800 pixels.
      responses:
        '201':
          description: Review image stored and linked to the review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Authenticated Consumer is not the review owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

