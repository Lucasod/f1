      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutPreviewRequest'
      responses:
        '200':
          description: Checkout preview calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutPreviewResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Stock validation failed or coupon invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /checkout:
    post:
      summary: Create order from cart
      description: Validates stock, applies coupons, creates Order and OrderVendorGroups with status PENDING_PAYMENT. Returns a local placeholder clientSecret for development only; no Stripe PaymentIntent is created and no payment is authorized or captured.
      operationId: createOrderFromCart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Local order created. Placeholder payment data does not represent provider confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Cart empty, shipping address not found, or product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Insufficient stock, coupon invalid, or cart version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders:
    get:
      summary: List orders
      description: Returns paginated list of orders. Consumer sees their own orders; Vendor sees OrderVendorGroups where vendorId matches their vendor. Supports filtering by status.
      operationId: listOrders
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter orders by status
          schema:
            type: string
            enum: [PENDING_PAYMENT, PAID, PROCESSING, SHIPPED, DELIVERED, CANCELLED, FAILED_PAYMENT]
        - name: page
          in: query
          description: Page number (1-based)
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/summary:
    get:
      summary: Get the authenticated consumer's order summary
      description: Returns counts, total spend, and up to five recent orders belonging only to the authenticated consumer.
      operationId: getConsumerOrderSummary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Consumer order summary
          content:
            application/json:
              schema:
                type: object
                required: [summary]
                properties:
                  summary:
                    type: object
                    required: [totalOrders, totalSpent, pendingOrders, deliveredOrders, recentOrders]
                    properties:
                      totalOrders:
                        type: integer
                      totalSpent:
                        type: number
                      pendingOrders:
                        type: integer
                      deliveredOrders:
                        type: integer
                      recentOrders:
                        type: array
                        maxItems: 5
                        items:
                          $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}:
    get:
      summary: Get order details
      description: Returns full order details for Consumer (own orders). Vendor sees only their OrderVendorGroups within the order.
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Order unique identifier
      responses:
        '200':
          description: Order retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      summary: Cancel order
      description: Cancels an order. Consumer only. Allowed only if no OrderVendorGroup has status SHIPPED or DELIVERED per CD-059. Returns updated order.
      operationId: cancelOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Order unique identifier
      responses:
        '200':
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Cannot cancel - one or more vendor groups already SHIPPED or DELIVERED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/vendor-groups/{ovgId}:
    get:
      summary: Get OrderVendorGroup details (Vendor)
      description: Returns details of a specific OrderVendorGroup. Vendor can only access their own OVGs where vendorId matches.
      operationId: getOrderVendorGroup
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Order unique identifier
        - name: ovgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: OrderVendorGroup unique identifier
      responses:
        '200':
          description: OrderVendorGroup retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderVendorGroup'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/vendor-groups/{ovgId}/status:
    patch:
      summary: Update OrderVendorGroup status (Vendor)
      description: "Updates the status of an OrderVendorGroup. Vendor can only update their own OVGs. Status transitions per CD-063: PENDING -> CONFIRMED -> PREPARING -> SHIPPED -> DELIVERED; CANCELLED allowed before SHIPPED; RETURNED allowed after DELIVERED."
      operationId: updateOrderVendorGroupStatus
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Order unique identifier
        - name: ovgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: OrderVendorGroup unique identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
      responses:
        '200':
          description: OrderVendorGroup status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderVendorGroup'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Invalid status transition per CD-063
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /payments/intent:
    post:
      summary: Create PaymentIntent for order
      description: Planned Stripe integration contract (not connected in the current local runtime). No Stripe PaymentIntent is created until provider integration is configured and implemented.
      operationId: createPaymentIntent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentRequest'
      responses:
        '201':
          description: PaymentIntent created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Order already has a payment intent or invalid order status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /payments/webhook:
    post:
      summary: Stripe webhook handler
      description: "Planned Stripe integration contract; the current runtime does not mount this endpoint or process provider webhooks."
      operationId: handleStripeWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Stripe event object
              properties:
                id:
                  type: string
                  description: Event ID
                  example: "evt_1234567890"
                type:
                  type: string
                  description: Event type
                  example: "payment_intent.succeeded"
                data:
                  type: object
                  description: Event data
                  properties:
                    object:
                      type: object
                      description: The Stripe object
      responses:
        '200':
          description: Webhook received and processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          description: Invalid signature or malformed payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /payments/{paymentId}:
