          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create review (Consumer, verified purchase required)
      description: Creates and immediately publishes a review. The authenticated Consumer must own a delivered order item for this product. One review is allowed per order item. Non-empty review image lists are not supported yet.
