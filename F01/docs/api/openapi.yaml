            format: uuid
          example: []
        inclusionCategories:
          type: array
          description: Category IDs where coupon applies (empty = all)
          items:
            type: string
            format: uuid
          example: []
        exclusionProducts:
          type: array
          description: Product IDs where coupon does not apply
          items:
            type: string
            format: uuid
          example: []
        exclusionCategories:
          type: array
          description: Category IDs where coupon does not apply
          items:
            type: string
            format: uuid
